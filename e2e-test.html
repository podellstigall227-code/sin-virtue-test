<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>pending</title>
<style>html,body{margin:0}iframe{display:block;border:0;width:390px;height:900px}</style>
</head>
<body>
<iframe id="f" src="./index.html"></iframe>
<script>
var f = document.getElementById('f');
var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
var started = false;

async function waitFor(fn, timeout) {
  var t0 = Date.now();
  while (Date.now() - t0 < timeout) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(80);
  }
  return false;
}

async function run() {
  if (started) return;
  started = true;
  try {
    var ready = await waitFor(function () {
      var d = f.contentDocument;
      return d && d.getElementById('startBtn');
    }, 20000);
    if (!ready) throw new Error('start button never appeared');

    var d = f.contentDocument;
    d.getElementById('startBtn').click();
    await sleep(300);

    for (var i = 0; i < 40; i++) {
      var ok = await waitFor(function () {
        return d.querySelectorAll('#options .option').length === 4;
      }, 5000);
      if (!ok) throw new Error('q' + (i + 1) + ' options missing');

      var opts = d.querySelectorAll('#options .option');
      opts[(i * 3 + 1) % 4].click();

      var want = ('0' + (i + 2)).slice(-2);
      var advanced = await waitFor(function () {
        if (i === 39) return d.getElementById('screenResult').classList.contains('is-active');
        return d.getElementById('qIndex').textContent.indexOf(want) === 0;
      }, 6000);
      if (!advanced) throw new Error('stuck at q' + (i + 1));
    }

    await sleep(1200);
    var pcts = Array.prototype.slice.call(d.querySelectorAll('.t-pct')).map(function (n) {
      return parseInt(n.textContent, 10);
    });
    document.title = 'LIVE E2E ' + JSON.stringify({
      ok: d.getElementById('screenResult').classList.contains('is-active'),
      sin: d.getElementById('sinName').textContent,
      sinPct: d.getElementById('sinPct').textContent,
      virtue: d.getElementById('virtueName').textContent,
      virtuePct: d.getElementById('virtuePct').textContent,
      rows: pcts.length,
      sum: pcts.reduce(function (a, b) { return a + b; }, 0),
      combo: d.getElementById('combo').textContent.trim(),
      totals: d.getElementById('sinTotal').textContent + ' / ' + d.getElementById('virtueTotal').textContent
    });
  } catch (e) {
    document.title = 'LIVE E2E ERROR ' + e.message;
  }
}

f.addEventListener('load', run);
run();
</script>
</body>
</html>
